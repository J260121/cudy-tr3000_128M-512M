name: ImmortalWrt Builder DIY

on:
  repository_dispatch:
    types:
      - "Source Code Update"

  workflow_dispatch:
    inputs:
      device:
        description: "编译设备型号"
        required: true
        type: choice
        default: "all"
        options:
          - "512M"
          - "256M"
          - "128M"
          - "QLB-4Pro"
          - "ikuai-q6000-nand"
          - "all"

      repo:
        description: "指定源码仓库地址"
        required: true
        type: string
        default: "https://github.com/padavanonly/immortalwrt-mt798x-6.6.git"

      branch:
        description: "指定源码 Branch"
        required: false
        type: string
        default: "openwrt-24.10-6.6"

      commit:
        description: "指定源码 Commit，留空使用 Branch 最新代码"
        required: false
        type: string
        default: ""

      release:
        description: "发布到 GitHub Release"
        required: false
        type: boolean
        default: true

      prerelease:
        description: "预发布版本"
        required: false
        type: boolean
        default: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  TZ: Asia/Shanghai

  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device || 'all' }}

  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo || 'https://github.com/padavanonly/immortalwrt-mt798x-6.6' }}

  REPO_BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'openwrt-24.10-6.6' }}

  REPO_COMMIT: ${{ github.event.inputs.commit || github.event.client_payload.commit || '' }}

  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G

  OPENWRT_DIR: /workdir/openwrt

  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || 'true' }}

  PRERELEASE: ${{ github.event.inputs.prerelease || github.event.client_payload.prerelease || 'false' }}


jobs:

  build:
    name: "🔨 Build Firmware"
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      actions: write

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # Build Environment
      # ==========================================================

      - name: Init Environment
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update -qq

          sudo apt-get install -y \
            libncurses5-dev \
            libncurses-dev \
            liblzo2-dev \
            lzop \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

          sudo apt-get clean

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir

          sudo chown -R \
            "$(id -u):$(id -g)" \
            /workdir


      # ==========================================================
      # Clone Source
      # ==========================================================

      - name: Clone Source
        working-directory: /workdir
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$OPENWRT_DIR"

          git clone \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            --single-branch \
            --filter=blob:none \
            openwrt

          cd "$OPENWRT_DIR"

          if [ -n "$REPO_COMMIT" ]; then
            git fetch \
              --depth=1 \
              origin \
              "$REPO_COMMIT"

            git checkout "$REPO_COMMIT"
          fi

          echo "========================================"
          echo "IMMORTALWRT"
          echo "========================================"

          echo "Repository:"
          echo "$REPO_URL"

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Commit:"
          git rev-parse HEAD


      # ==========================================================
      # Prepare DIY Files
      # ==========================================================

      - name: Prepare DIY Files
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$OPENWRT_DIR"

          chmod +x \
            "$GITHUB_WORKSPACE"/*.sh


            cp -f \
              "$GITHUB_WORKSPACE"/dts/* \
              target/linux/mediatek/dts/
          


      # ==========================================================
      # DIY Part 1
      #
      # 必须在 feeds update 之前
      # ==========================================================

      - name: DIY Part 1
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$OPENWRT_DIR"

          "$GITHUB_WORKSPACE/diy-part1.sh"


      # ==========================================================
      # Update Feeds
      # ==========================================================

      - name: Update Feeds
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$OPENWRT_DIR"

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # Device DIY
      #
      # diy-part2 / qlb / ikuai
      # 必须在 feeds update 后执行。
      # ==========================================================

      - name: Device DIY
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$OPENWRT_DIR"

          case "$DEVICE_INPUT" in

            512M)
              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;

            256M)
              # 256M profile 同样由 diy-part2.sh 创建
              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;

            128M)
              # 使用原有 128M config
              ;;

            QLB-4Pro)
              "$GITHUB_WORKSPACE/diy-qlb.sh"
              ;;

            ikuai-q6000-nand)
              "$GITHUB_WORKSPACE/diy-ikuai-q6000-nand.sh"
              ;;

            all)
              "$GITHUB_WORKSPACE/diy-part2.sh"
              "$GITHUB_WORKSPACE/diy-qlb.sh"
              "$GITHUB_WORKSPACE/diy-ikuai-q6000-nand.sh"
              ;;

            *)
              echo "Unknown device:"
              echo "$DEVICE_INPUT"
              exit 1
              ;;

          esac


      # ==========================================================
      # Validate Config Files
      # ==========================================================

      - name: Validate Config Files
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in \
            "$GITHUB_WORKSPACE/config/512m.config" \
            "$GITHUB_WORKSPACE/config/256m.config" \
            "$GITHUB_WORKSPACE/config/128m.config" \
            "$GITHUB_WORKSPACE/config/mt7981-QLB-4Pro.config" \
            "$GITHUB_WORKSPACE/config/mt7986-ikuai-q6000-nand.config"
          do
            if [ ! -f "$file" ]; then
              echo "Missing config:"
              echo "$file"
              exit 1
            fi
          done


      # ==========================================================
      # Ccache
      #
      # 不再依赖错误的 steps.config-hash
      # ==========================================================

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache

          key: >-
            ${{ runner.os }}-
            openwrt-ccache-
            ${{ env.REPO_BRANCH }}-
            ${{ hashFiles(
              '**/*.sh',
              'config/*.config',
              'dts/*'
            ) }}

          restore-keys: |
            ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-openwrt-ccache-


      # ==========================================================
      # Download Cache
      # ==========================================================

      - name: Cache DL
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl

          key: >-
            ${{ runner.os }}-
            openwrt-dl-
            ${{ env.REPO_BRANCH }}-
            ${{ hashFiles('feeds.conf.default') }}

          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-openwrt-dl-


      # ==========================================================
      # Configure Ccache
      # ==========================================================

      - name: Configure Ccache
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache \
            --set-config=cache_dir="$CCACHE_DIR"

          ccache \
            --set-config=max_size="$CCACHE_MAXSIZE"

          ccache \
            --set-config=compression=true

          ccache \
            --set-config=compression_level=6

          ccache -z


      # ==========================================================
      # Download
      # ==========================================================

      - name: Download Sources
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$OPENWRT_DIR"

          make download \
            -j"$(nproc)"

          find dl \
            -type f \
            -size -1024c \
            -delete


      # ==========================================================
      # Compile
      # ==========================================================

      - name: Compile
        id: compile
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$OPENWRT_DIR"

          if [ "$DEVICE_INPUT" = "all" ]; then
            DEVICES="
              512M
              256M
              128M
              QLB-4Pro
              ikuai-q6000-nand
            "
          else
            DEVICES="$DEVICE_INPUT"
          fi

          rm -rf \
            "$GITHUB_WORKSPACE/firmware_collection"

          mkdir -p \
            "$GITHUB_WORKSPACE/firmware_collection"


          for DEV in $DEVICES; do

            echo
            echo "========================================"
            echo "🚀 BUILD: $DEV"
            echo "========================================"


            # ----------------------------------------------------
            # Select config
            # ----------------------------------------------------

            case "$DEV" in

              512M)
                CONFIG="$GITHUB_WORKSPACE/config/512m.config"
                ;;

              256M)
                CONFIG="$GITHUB_WORKSPACE/config/256m.config"
                ;;

              128M)
                CONFIG="$GITHUB_WORKSPACE/config/128m.config"
                ;;

              QLB-4Pro)
                CONFIG="$GITHUB_WORKSPACE/config/mt7981-QLB-4Pro.config"
                ;;

              ikuai-q6000-nand)
                CONFIG="$GITHUB_WORKSPACE/config/mt7986-ikuai-q6000-nand.config"
                ;;

              *)
                echo "Unknown device:"
                echo "$DEV"
                exit 1
                ;;

            esac


            # ----------------------------------------------------
            # Clean previous configuration
            # ----------------------------------------------------

            rm -f .config

            cp -f \
              "$CONFIG" \
              .config


            echo
            echo "Config:"
            echo "$CONFIG"


            # ----------------------------------------------------
            # IMPORTANT
            #
            # diy-part3 必须在 cp config 后执行。
            #
            # 它会：
            # 1. 添加 PassWall feeds
            # 2. 更新 PassWall feeds
            # 3. 安装 PassWall
            # 4. 修改当前 .config
            #
            # 如果放在这里之前，后面的 cp config 会把
            # PassWall 配置全部覆盖。
            # ----------------------------------------------------

            "$GITHUB_WORKSPACE/diy-part3.sh"


            # ----------------------------------------------------
            # Final config
            # ----------------------------------------------------

            make defconfig


            # ----------------------------------------------------
            # 显示当前设备 Target
            # ----------------------------------------------------

            echo
            echo "TARGET:"
            grep \
              '^CONFIG_TARGET_.*=y' \
              .config \
              || true


            echo
            echo "PROFILE:"
            grep \
              '^CONFIG_TARGET_PROFILE=' \
              .config \
              || true


            echo
            echo "PASSWALL:"
            grep \
              '^CONFIG_PACKAGE_luci-app-passwall=' \
              .config \
              || true


            # ----------------------------------------------------
            # 清理当前 target 的旧输出
            #
            # 避免后面的设备收集到前一个设备的镜像。
            # ----------------------------------------------------

            rm -rf \
              bin/targets/mediatek/filogic

            mkdir -p \
              bin/targets/mediatek/filogic


            # ----------------------------------------------------
            # Build
            # ----------------------------------------------------

            echo
            echo "Start build: $DEV"


            if make \
              -j"$(nproc)" \
              CC="ccache gcc" \
              CXX="ccache g++"
            then

              echo
              echo "✅ BUILD SUCCESS: $DEV"

            else

              echo
              echo "⚠️ Parallel build failed."
              echo "Retry with -j1 V=s"


              make \
                -j1 \
                V=s \
                CC="ccache gcc" \
                CXX="ccache g++"

            fi


            # ----------------------------------------------------
            # Collect current device
            # ----------------------------------------------------

            OUTDIR="$GITHUB_WORKSPACE/firmware_collection/$DEV"

            mkdir -p "$OUTDIR"


            find \
              bin/targets/mediatek/filogic \
              -type f \
              \( \
                -name "*.bin" \
                -o -name "*.itb" \
                -o -name "*.img" \
                -o -name "*.ubi" \
                -o -name "*.tar" \
                -o -name "*.gz" \
                -o -name "*.zip" \
              \) \
              -exec cp -f {} "$OUTDIR/" \;


            # ----------------------------------------------------
            # Verify output
            # ----------------------------------------------------

            if ! find "$OUTDIR" \
                -type f \
                -print \
                | grep -q .; then

              echo
              echo "ERROR: No firmware generated for:"
              echo "$DEV"

              find \
                bin/targets/mediatek/filogic \
                -type f \
                | sort \
                || true

              exit 1

            fi


            echo
            echo "Firmware generated for $DEV:"

            find "$OUTDIR" \
              -maxdepth 1 \
              -type f \
              -printf "%f\n" \
              | sort


            # ----------------------------------------------------
            # Remove .config before next device
            # ----------------------------------------------------

            rm -f .config

          done


          echo "status=success" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # Ccache Statistics
      # ==========================================================

      - name: Ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true


      # ==========================================================
      # Artifact
      # ==========================================================

      - name: Upload Artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_${{ env.DEVICE_INPUT }}
          path: firmware_collection/
          if-no-files-found: error
          compression-level: 9


      # ==========================================================
      # Release Information
      # ==========================================================

      - name: Generate Release
        id: tag
        if: >
          steps.compile.outputs.status == 'success' &&
          env.UPLOAD_RELEASE == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILD_TIME="$(date '+%Y.%m.%d-%H%M%S')"

          RELEASE_TAG="${BUILD_TIME}-${GITHUB_RUN_NUMBER}"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          COMMIT="$(
            cd "$OPENWRT_DIR"
            git rev-parse --short HEAD
          )"

          cat > release.txt << EOF
          ## 📦 ImmortalWrt Firmware

          **Build Time:** $BUILD_TIME

          **Device:** $DEVICE_INPUT

          **Branch:** $REPO_BRANCH

          **Commit:** $COMMIT

          **Repository:** $REPO_URL

          **Workflow Run:** $GITHUB_RUN_NUMBER
          EOF

          echo "status=success" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # Release
      # ==========================================================

      - name: Upload Release
        if: steps.tag.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}

          files: |
            firmware_collection/**/*.bin
            firmware_collection/**/*.itb
            firmware_collection/**/*.img
            firmware_collection/**/*.ubi
            firmware_collection/**/*.tar
            firmware_collection/**/*.gz
            firmware_collection/**/*.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # Clean Workflow Runs
      # ==========================================================

      - name: Clean Old Runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9


      # ==========================================================
      # Clean Releases
      # ==========================================================

      - name: Clean Old Releases
        if: >
          env.UPLOAD_RELEASE == 'true' &&
          !cancelled()
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
