name: Build ImmortalWrt for Cudy TR3000

on:
  workflow_dispatch:
    inputs:
      partition_size:
        description: 'UBIFS Partition Size'
        required: true
        default: '112M'
        type: choice
        options:
          - '112M'
          - '122M'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 允许创建 Release 和上传文件
      actions: read    # 允许读取 Actions 状态（可选，但推荐）
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo bash -c ' bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh) '
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL immortalwrt
        ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

    - name: Update Feeds
      run: |
        cd immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Default Config
      run: |
        cd immortalwrt
        # 加载 MT7981 默认配置 (适配 Cudy TR3000)
        cp -f defconfig/mt7981-ax3000.config .config
        make defconfig

    - name: Customize Partition (Optional)
      run: |
        cd immortalwrt
        if [ "${{ github.event.inputs.partition_size }}" == "122M" ]; then
          echo "Setting partition to 122M..."
          sed -i 's/reg = <0x5c0000 0x7000000>;/reg = <0x5c0000 0x7a40000>;/' target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1-ubootmod.dts
        fi

    - name: Download Packages
      run: |
        cd immortalwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd immortalwrt
        echo "Starting compilation with $(nproc) threads..."
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Package Firmware
      if: steps.compile.outcome == 'success'
      run: |
        mkdir -p output
        # 复制生成的固件文件
        cp immortalwrt/bin/targets/mediatek/filogic/*.bin output/ 2>/dev/null || true
        cp immortalwrt/bin/targets/mediatek/filogic/*.img.gz output/ 2>/dev/null || true
        ls -lh output

    - name: Upload Artifact
      if: steps.compile.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Cudy-TR3000-Firmware-${{ github.event.inputs.partition_size }}
        path: output/*

    - name: Create Release
      if: steps.compile.outcome == 'success'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v$(date +"%Y.%m.%d")
        name: Cudy TR3000 Build $(date +"%Y-%m-%d")
        body: |
          - Source: ${{ env.REPO_URL }}
          - Branch: ${{ env.REPO_BRANCH }}
          - Partition: ${{ github.event.inputs.partition_size }}
        files: output/*
